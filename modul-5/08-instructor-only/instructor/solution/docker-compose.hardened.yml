# REFERENCE SOLUTION - container hardening (Layer 5 / sandboxing).
# Use as an override:  docker compose -f docker-compose.yml -f instructor/solution/docker-compose.hardened.yml up --build
services:
  app:
    user: "10001:10001"          # not root
    read_only: true              # immutable root filesystem
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    # Writable state lives only in the named volume mounted at /app/runtime.
