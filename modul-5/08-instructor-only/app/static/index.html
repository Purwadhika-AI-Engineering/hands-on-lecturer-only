<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AcmeBot lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;color:#1f4745}
 h1{color:#115853;margin-bottom:4px} .sub{color:#4a5a57;margin-top:0}
 #log{border:1px solid #c6f9f0;background:#f0f4f1;border-radius:10px;padding:12px;height:360px;overflow:auto}
 .u{color:#115853;font-weight:600;margin-top:10px} .b{white-space:pre-wrap;margin:2px 0 6px}
 .meta{font-size:12px;color:#4a5a57;background:#fff;border-left:3px solid #1a9988;padding:4px 8px;margin:2px 0}
 .bad{border-left-color:#d9480f;color:#9a3b00} .row{display:flex;gap:8px;margin-top:10px}
 input[type=text]{flex:1;padding:10px;border:1px solid #9bb;border-radius:8px}
 button,select{padding:10px 14px;border-radius:8px;border:0;background:#115853;color:#fff;cursor:pointer}
 select{background:#fff;color:#115853;border:1px solid #9bb} .tools{margin-top:12px;font-size:13px}
 pre{background:#fff;padding:8px;border-radius:8px;max-height:140px;overflow:auto;font-size:12px}
</style></head><body>
<h1>AcmeBot <span style="font-size:14px;color:#d9480f">training lab · vulnerable by design</span></h1>
<p class="sub">Synthetic data only. Attack your own sandbox, nothing else.</p>
<div id="log"></div>
<div class="row">
 <select id="role"><option>customer</option><option>staff</option></select>
 <input id="msg" type="text" placeholder="Ask AcmeBot something…" autofocus>
 <button onclick="send()">Send</button>
</div>
<div class="tools">
 <input type="file" id="file"> <button onclick="up()">Upload to knowledge base</button>
 <button onclick="loadBox()" style="background:#1a9988">Show outbox</button>
 <button onclick="reset()" style="background:#9a3b00">Reset lab</button>
 <pre id="out" hidden></pre>
</div>
<script>
const log=document.getElementById('log'), out=document.getElementById('out');
function add(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
async function send(){
 const m=msg.value.trim(); if(!m)return; msg.value=''; add('u','You: '+m);
 const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,role:role.value})});
 const j=await r.json(); add('b',j.answer);
 (j.tool_calls||[]).forEach(t=>add('meta '+(t.status==='executed'?'bad':''),'tool '+t.name+' ['+t.status+'] '+JSON.stringify(t.args).slice(0,160)));
 (j.guard_events||[]).forEach(e=>add('meta','guard '+e.layer+': '+e.action+' '+e.detail));
}
msg.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
async function up(){const f=file.files[0]; if(!f)return; const fd=new FormData(); fd.append('file',f);
 const r=await fetch('/upload?role='+role.value,{method:'POST',body:fd}); add('meta',(r.ok?'uploaded ':'rejected ')+f.name+' '+(await r.text()).slice(0,200))}
async function loadBox(){const j=await (await fetch('/outbox')).json(); out.hidden=false; out.textContent=j.length?JSON.stringify(j,null,1):'(outbox is empty)'}
async function reset(){await fetch('/admin/reset',{method:'POST'}); log.innerHTML=''; out.hidden=true; add('meta','lab reset')}
</script></body></html>
