[pytest]
addopts = -ra
markers =
    agent: tes untuk layanan LLM agent (port 8000)
    cv: tes untuk layanan computer vision (port 8001)
    llm: tes yang benar-benar memanggil OpenAI (butuh OPENAI_API_KEY, biaya sangat kecil)
    docker: tes yang memakai Docker CLI (docker inspect, docker exec, dst.)
    slow: tes yang me-restart container atau membuat container sementara
